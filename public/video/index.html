<style>
  :root { --primary: #002134; --gold: #D9A84E; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 80% 0%, #17385a 0%, var(--primary) 55%); color: #fff;

  h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); line-height: 1.35; text-align: center; }
  .frame { width: min(1100px, 100%); border-radius: 16px; overflow: hidden; border: 1px solid rgba(217, 168, 78, .55); box-shadow: 0 30px 80px rgba(0, 0, 0, .45); background: #000; }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: 14px; }
  a { color: #DCE5EC; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, .3); padding-bottom: 2px; }
  a:hover { color: #fff; border-color: #fff; }
  .foot { color: #8FA3B3; font-size: 12px; }
</style>

  <span class="eb">النموذج الأولي</span>
